<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EAMIN Admin</title><style>body{font-family:Arial;background:#f3f7fd;color:#17345c;padding:18px}.box{max-width:850px;margin:auto;background:white;padding:18px;border-radius:14px}input,button{font:inherit;padding:11px;margin:5px;border-radius:8px}button{background:#1769d2;color:white;border:0}.item{border:1px solid #ddd;padding:12px;margin:10px 0;border-radius:9px}</style></head><body><div class="box"><h2>EAMIN TOP-UP Admin</h2><div id="login"><input id="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Login</button></div><div id="app" hidden><p id="who"></p><button onclick="loadAll()">Refresh</button><button onclick="logout()">Logout</button><h3>Pending Add Money</h3><div id="wallets"></div><h3>Pending Orders</h3><div id="orders"></div></div><p id="msg"></p></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient("https://jaldowgrjugtessgcgnf.supabase.co","sb_publishable_6FLmBjyIb-Fyb8w0sQ7lWw_jMRdkLPA");const $=x=>document.getElementById(x);function say(x){$("msg").textContent=x}async function login(){const r=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(r.error)return say(r.error.message);check()}async function check(){const r=await sb.auth.getUser();const user=r.data.user;if(!user)return;const p=await sb.from("profiles").select("role").eq("id",user.id).single();if(p.error||p.data.role!=="admin")return say("এই অ্যাকাউন্টে Admin অনুমতি নেই। Supabase-এ role admin করতে হবে।");$("login").hidden=true;$("app").hidden=false;$("who").textContent=user.email;loadAll()}async function logout(){await sb.auth.signOut();location.reload()}async function loadAll(){const pair=await Promise.all([sb.from("wallet_requests").select("*").eq("status","pending").order("created_at"),sb.from("orders").select("*").eq("status","pending").order("created_at")]);const w=pair[0],o=pair[1];$("wallets").innerHTML=w.error?w.error.message:(w.data.length?w.data.map(x=>'<div class="item">৳'+x.amount_bdt+' '+x.payment_method+'<br>TrxID: '+x.transaction_id+'<br>User: '+x.user_id+'<br><button onclick="walletAction(\''+x.id+'\',true)">Approve & Add Balance</button><button onclick="walletAction(\''+x.id+'\',false)">Reject</button></div>').join(""):"কোনো Pending request নেই");$("orders").innerHTML=o.error?o.error.message:(o.data.length?o.data.map(x=>'<div class="item">'+x.product_name+' — '+x.package_label+'<br>UID: '+x.player_uid+' | TrxID: '+x.transaction_id+'<br><button onclick="orderAction(\''+x.id+'\',\'processing\')">Processing</button><button onclick="orderAction(\''+x.id+'\',\'completed\')">Completed</button><button onclick="orderAction(\''+x.id+'\',\'rejected\')">Reject</button></div>').join(""):"কোনো Pending order নেই")}async function walletAction(id,yes){if(yes){const r=await sb.rpc("admin_approve_wallet_request",{request_id:id});if(r.error)return say("Approve হয়নি: "+r.error.message)}else{const r=await sb.from("wallet_requests").update({status:"rejected"}).eq("id",id);if(r.error)return say(r.error.message)}say("Wallet request আপডেট হয়েছে");loadAll()}async function orderAction(id,status){const r=await sb.from("orders").update({status:status,updated_at:new Date().toISOString()}).eq("id",id);if(r.error)return say(r.error.message);say("Order আপডেট হয়েছে");loadAll()}sb.auth.getSession().then(check);</script></body></html>
