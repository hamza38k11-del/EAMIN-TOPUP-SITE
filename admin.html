<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EAMIN TOP-UP Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#f3f7fd;color:#17345c;font-family:Arial,sans-serif}.box{max-width:1000px;margin:auto;background:#fff;padding:18px;border-radius:14px;box-shadow:0 5px 24px #17345c12}h2{margin-top:4px}input,button{font:inherit;padding:11px;margin:5px 3px;border-radius:8px}input{border:1px solid #ccd8e8;max-width:100%;width:270px}button{background:#1769d2;color:#fff;border:0;cursor:pointer}.danger{background:#c43d4b}.muted{color:#65758d;font-size:13px}.item{border:1px solid #dce5f1;padding:12px;margin:10px 0;border-radius:9px;overflow-wrap:anywhere}.section{margin-top:22px}.status{font-weight:bold;color:#1769d2}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}#msg{white-space:pre-wrap;color:#a22}
</style></head><body><div class="box"><h2>🛡️ EAMIN TOP-UP Admin</h2><p class="muted">শুধু অনুমোদিত Admin অ্যাকাউন্ট দিয়ে লগইন করুন। পেমেন্ট অ্যাপে টাকা মিলিয়ে তারপর Approve করবেন।</p>
<div id="login"><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Login</button></div>
<div id="app" hidden><p id="who"></p><button onclick="loadAll()">↻ Refresh</button><button class="danger" onclick="logout()">Logout</button>
<div class="grid"><section class="section"><h3>💳 Registered Add Money</h3><div id="wallets">লোড হচ্ছে...</div></section><section class="section"><h3>💳 Guest Add Money</h3><div id="guestWallets">লোড হচ্ছে...</div></section>
<section class="section"><h3>📦 Registered Orders</h3><div id="orders">লোড হচ্ছে...</div></section><section class="section"><h3>📦 Guest Orders</h3><div id="guestOrders">লোড হচ্ছে...</div></section></div></div><p id="msg"></p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient("https://jaldowgrjugtessgcgnf.supabase.co","sb_publishable_6FLmBjyIb-Fyb8w0sQ7lWw_jMRdkLPA");const $=id=>document.getElementById(id);const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function say(v){$("msg").textContent=v}
async function login(){const r=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(r.error)return say(r.error.message);await check()}
async function check(){const r=await sb.auth.getUser();const user=r.data.user;if(!user)return;const p=await sb.from("profiles").select("role").eq("id",user.id).single();if(p.error||p.data.role!=="admin"){say("এই অ্যাকাউন্টে Admin অনুমতি নেই। Supabase-এ profiles.role = admin করতে হবে।");return} $("login").hidden=true;$("app").hidden=false;$("who").textContent="লগইন: "+user.email;await loadAll()}
async function logout(){await sb.auth.signOut();location.reload()}
function empty(id,msg){$(id).innerHTML='<p class="muted">'+msg+'</p>'}
async function loadAll(){
 const [w,gw,o,go]=await Promise.all([
 sb.from("wallet_requests").select("*").eq("status","pending").order("created_at",{ascending:false}),
 sb.from("guest_wallet_requests").select("*").eq("status","pending").order("created_at",{ascending:false}),
 sb.from("orders").select("*").in("status",["pending","processing"]).order("created_at",{ascending:false}),
 sb.from("guest_orders").select("*").in("status",["pending","processing"]).order("created_at",{ascending:false})
 ]);
 renderWallets(w);renderGuestWallets(gw);renderOrders(o);renderGuestOrders(go);
}
function renderWallets(r){if(r.error)return $("wallets").textContent=r.error.message;if(!r.data.length)return empty("wallets","কোনো Pending request নেই");$("wallets").innerHTML=r.data.map(x=>'<div class="item"><b>৳'+esc(x.amount_bdt)+' '+esc(x.payment_method)+'</b><br>TrxID: '+esc(x.transaction_id)+'<br>User ID: '+esc(x.user_id)+'<br><button onclick="walletAction(\''+esc(x.id)+'\',true)">Approve & Add Balance</button><button class="danger" onclick="walletAction(\''+esc(x.id)+'\',false)">Reject</button></div>').join("")}
function renderGuestWallets(r){if(r.error)return $("guestWallets").textContent=r.error.message;if(!r.data.length)return empty("guestWallets","কোনো Pending request নেই");$("guestWallets").innerHTML=r.data.map(x=>'<div class="item"><b>৳'+esc(x.amount_bdt)+' '+esc(x.payment_method)+'</b><br>Request: '+esc(x.request_code)+'<br>TrxID: '+esc(x.transaction_id)+'<br>মোবাইল: '+esc(x.customer_phone||"দেওয়া হয়নি")+'<br><button onclick="guestWalletAction(\''+esc(x.id)+'\',\'approved\')">Mark Approved</button><button class="danger" onclick="guestWalletAction(\''+esc(x.id)+'\',\'rejected\')">Reject</button></div>').join("")}
function renderOrders(r){if(r.error)return $("orders").textContent=r.error.message;if(!r.data.length)return empty("orders","কোনো Pending order নেই");$("orders").innerHTML=r.data.map(x=>'<div class="item"><b>'+esc(x.product_name)+' — '+esc(x.package_label)+'</b><br>UID: '+esc(x.player_uid)+'<br>TrxID: '+esc(x.transaction_id)+'<br>৳'+esc(x.amount_bdt)+' | '+esc(x.customer_phone)+'<br><span class="status">'+esc(x.status)+'</span><br>'+orderButtons("orderAction",x.id)+'</div>').join("")}
function renderGuestOrders(r){if(r.error)return $("guestOrders").textContent=r.error.message;if(!r.data.length)return empty("guestOrders","কোনো Pending order নেই");$("guestOrders").innerHTML=r.data.map(x=>'<div class="item"><b>'+esc(x.product_name)+' — '+esc(x.package_label)+'</b><br>Order: '+esc(x.order_code)+'<br>UID: '+esc(x.player_uid)+'<br>TrxID: '+esc(x.transaction_id)+'<br>৳'+esc(x.amount_bdt)+' | '+esc(x.customer_phone)+'<br><span class="status">'+esc(x.status)+'</span><br>'+orderButtons("guestOrderAction",x.id)+'</div>').join("")}
function orderButtons(fn,id){return '<button onclick="'+fn+'(&quot;'+esc(id)+'&quot;,&quot;processing&quot;)">Processing</button><button onclick="if(confirm(&quot;পেমেন্ট ও UID যাচাই করে অর্ডার সম্পন্ন করেছেন?&quot;))'+fn+'(&quot;'+esc(id)+'&quot;,&quot;completed&quot;)">Completed</button><button class="danger" onclick="if(confirm(&quot;এই অর্ডার Reject করবেন?&quot;))'+fn+'(&quot;'+esc(id)+'&quot;,&quot;rejected&quot;)">Reject</button>'}
async function walletAction(id,yes){if(yes&&!confirm('bKash/Nagad-এ টাকা পেয়েছেন এবং পরিমাণ মিলিয়েছেন?'))return;if(yes){const r=await sb.rpc("admin_approve_wallet_request",{request_id:id});if(r.error)return say("Approve হয়নি: "+r.error.message)}else{const r=await sb.from("wallet_requests").update({status:"rejected"}).eq("id",id);if(r.error)return say(r.error.message)}say("Wallet request আপডেট হয়েছে");loadAll()}
async function guestWalletAction(id,status){if(status==='approved'&&!confirm('bKash/Nagad-এ টাকা পেয়েছেন এবং TrxID মিলিয়েছেন?'))return;if(status==='rejected'&&!confirm('এই Add Money অনুরোধ Reject করবেন?'))return;const r=await sb.from("guest_wallet_requests").update({status}).eq("id",id);if(r.error)return say("Update হয়নি: "+r.error.message);say("Guest Add Money request আপডেট হয়েছে। Guest wallet-এ স্বয়ংক্রিয় ব্যালেন্স যোগ হয় না।");loadAll()}
async function orderAction(id,status){const r=await sb.from("orders").update({status,updated_at:new Date().toISOString()}).eq("id",id);if(r.error)return say(r.error.message);say("Order আপডেট হয়েছে");loadAll()}
async function guestOrderAction(id,status){const r=await sb.from("guest_orders").update({status,updated_at:new Date().toISOString()}).eq("id",id);if(r.error)return say(r.error.message);say("Guest order আপডেট হয়েছে");loadAll()}
sb.auth.getSession().then(check);
</script></body></html>
